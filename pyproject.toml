[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer-cli"
version = "1.0.0"
description = "Fast Nginx and Apache access log metrics and anomaly analyzer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Afzalbek", email = "afzalbek-dev@users.noreply.github.com"}]

[project.scripts]
log-analyzer = "log_analyzer.cli:main"
